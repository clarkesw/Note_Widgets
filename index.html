<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StepViz Widgets</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 680px;
    margin: 32px auto;
    padding: 0 16px;
    color: #1a1a1a;
    background: #ffffff;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  p.sub { font-size: 14px; color: #6b7280; margin-top: 0; }

  #list-status {
    font-size: 13px;
    color: #6b7280;
    margin: 20px 0;
  }
  #list-status.error { color: #c53030; }

  section.category {
    margin-top: 28px;
  }
  section.category:first-of-type {
    margin-top: 20px;
  }
  h2.category-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #8a93a3;
    margin: 0 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid #e5e7eb;
  }

  ul.widget-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  ul.widget-list li {
    border: 1px solid #e5e7eb;
    background: #f7f8fa;
    border-radius: 10px;
    padding: 12px 16px;
    transition: border-color 0.15s ease;
  }
  ul.widget-list li:hover { border-color: #bbb; }
  ul.widget-list a {
    font-size: 15px;
    font-weight: 500;
    color: #2b6cb0;
    text-decoration: none;
  }
  ul.widget-list a:hover { text-decoration: underline; }
  ul.widget-list .filename {
    display: block;
    margin-top: 2px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    color: #9aa1ad;
  }

  footer {
    margin-top: 32px;
    font-size: 12px;
    color: #9aa1ad;
  }
</style>
</head>
<body>

<h1>StepViz Widgets</h1>
<p class="sub">Interactive step-through explainers for CS concepts.</p>

<div id="list-status">Loading widget list&hellip;</div>
<div id="categories"></div>

<footer id="footer-note"></footer>

<script>
  // ---- CONFIG: fill these in for your repo ----
  const OWNER  = "clarkesw";
  const REPO   = "Note_Widgets";
  const BRANCH = "main";
  // -----------------------------------------------

  // Category display order — mirrors the Evernote notebook order.
  // Folder names in the repo should match these exactly.
  const CATEGORY_ORDER = [
    "AWS",
    "DevOps",
    "Java",
    "Java - DSA",
    "Java - Functional",
    "Java - Threading",
    "Messaging",
    "Microservices",
    "Persistence",
    "Security",
    "Spring",
    "Testing"
  ];
  const UNCATEGORIZED = "Uncategorized";
  const EXCLUDED_FOLDERS = ["old"]; // top-level folder names to skip entirely (case-insensitive)

  const statusEl = document.getElementById("list-status");
  const categoriesEl = document.getElementById("categories");
  const footerEl = document.getElementById("footer-note");

  function titleFromFilename(name) {
    return name
      .replace(/\.html?$/i, "")
      .replace(/[_-]+/g, " ")
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function encodePath(path) {
    return path.split("/").map(encodeURIComponent).join("/");
  }

  async function loadWidgets() {
    if (OWNER.startsWith("YOUR-") || REPO.startsWith("YOUR-")) {
      statusEl.textContent = "Set OWNER and REPO at the top of the <script> tag in index.html, then reload.";
      statusEl.classList.add("error");
      return;
    }

    // Recursive tree API pulls every file across every folder in one call.
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

    try {
      const res = await fetch(url, {
        headers: { Accept: "application/vnd.github+json" }
      });

      if (!res.ok) {
        if (res.status === 403) {
          statusEl.textContent = "GitHub API rate limit reached — try again in a bit.";
        } else if (res.status === 404) {
          statusEl.textContent = `Couldn't find ${OWNER}/${REPO} (branch "${BRANCH}"). Check the config values.`;
        } else {
          statusEl.textContent = `GitHub API error (${res.status}).`;
        }
        statusEl.classList.add("error");
        return;
      }

      const data = await res.json();
      const entries = data.tree || [];

      const widgets = entries
        .filter(e => e.type === "blob")
        .filter(e => /\.html?$/i.test(e.path))
        .filter(e => e.path.toLowerCase() !== "index.html")
        .map(e => {
          const parts = e.path.split("/");
          const filename = parts[parts.length - 1];
          const category = parts.length > 1 ? parts[0] : UNCATEGORIZED;
          return { path: e.path, filename, category };
        })
        .filter(w => !EXCLUDED_FOLDERS.some(f => f.toLowerCase() === w.category.toLowerCase()));

      if (widgets.length === 0) {
        statusEl.textContent = "No widgets found in this repo yet.";
        return;
      }

      statusEl.remove();

      // Group by category
      const byCategory = new Map();
      widgets.forEach(w => {
        if (!byCategory.has(w.category)) byCategory.set(w.category, []);
        byCategory.get(w.category).push(w);
      });

      // Order: known categories in CATEGORY_ORDER first (only if non-empty),
      // then any other folder names alphabetically, then Uncategorized last.
      const knownPresent = CATEGORY_ORDER.filter(c => byCategory.has(c));
      const extraFolders = [...byCategory.keys()]
        .filter(c => c !== UNCATEGORIZED && !CATEGORY_ORDER.includes(c))
        .sort((a, b) => a.localeCompare(b));
      const orderedCategories = [...knownPresent, ...extraFolders];
      if (byCategory.has(UNCATEGORIZED)) orderedCategories.push(UNCATEGORIZED);

      orderedCategories.forEach(category => {
        const items = byCategory.get(category).sort((a, b) => a.filename.localeCompare(b.filename));

        const section = document.createElement("section");
        section.className = "category";

        const h2 = document.createElement("h2");
        h2.className = "category-title";
        h2.textContent = category;
        section.appendChild(h2);

        const ul = document.createElement("ul");
        ul.className = "widget-list";

        items.forEach(w => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = encodePath(w.path);
          a.textContent = titleFromFilename(w.filename);
          const filename = document.createElement("span");
          filename.className = "filename";
          filename.textContent = w.path;
          li.appendChild(a);
          li.appendChild(filename);
          ul.appendChild(li);
        });

        section.appendChild(ul);
        categoriesEl.appendChild(section);
      });

      footerEl.textContent = `${widgets.length} widget${widgets.length === 1 ? "" : "s"} across ${orderedCategories.length} ${orderedCategories.length === 1 ? "category" : "categories"} · refreshed on load from ${OWNER}/${REPO}`;

    } catch (err) {
      statusEl.textContent = "Couldn't reach the GitHub API. Check your connection and try again.";
      statusEl.classList.add("error");
    }
  }

  loadWidgets();
</script>

</body>
</html>
